name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install aiosqlite

      - name: Verify Alembic Configuration
        run: |
          cp .env.example .env
          alembic check || true

      - name: Run Pytest Verification Suite
        run: |
          pytest backend/tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Local Compose Configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config

      - name: Validate Production Compose Configuration
        env:
          POSTGRES_USER: genius_prod
          POSTGRES_PASSWORD: super_secure_prod_password_99
          SECRET_KEY: super_strong_production_secret_key_998811223344
          CORS_ORIGINS: https://genius.example.com
        run: |
          docker compose -f docker-compose.prod.yml config
