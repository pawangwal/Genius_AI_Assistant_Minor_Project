name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genius
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: genius_ai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U genius -d genius_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      AUTH_REQUIRED: "false"
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      POSTGRES_USER: genius
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_DB: genius_ai
      POSTGRES_TEST_USER: genius_test
      POSTGRES_TEST_PASSWORD: ${{ secrets.CI_POSTGRES_TEST_PASSWORD }}
      POSTGRES_TEST_DB: genius_ai_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      OPENROUTER_MODEL: "nvidia/nemotron-3.5-lightning:free"


    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5433 -U genius -d genius_ai; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL failed to become ready." >&2
          exit 1

      - name: Provision isolated test database
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5433 -U genius -d genius_ai -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE genius_test WITH LOGIN PASSWORD '${{ secrets.CI_POSTGRES_TEST_PASSWORD }}';
          CREATE DATABASE genius_ai_test OWNER genius_test;
          REVOKE CONNECT ON DATABASE genius_ai FROM PUBLIC;
          GRANT CONNECT ON DATABASE genius_ai TO genius;
          GRANT ALL PRIVILEGES ON DATABASE genius_ai_test TO genius_test;
          SQL

      - name: Apply migrations to application database
        run: |
          python - <<'PY'
          from alembic import command
          from alembic.config import Config
          from backend.app.core.config import settings

          config = Config("alembic.ini")
          config.set_main_option("sqlalchemy.url", settings.DATABASE_URL)
          command.upgrade(config, "head")
          PY

      - name: Run Pytest Verification Suite
        run: pytest backend/tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Local Compose Configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config

      - name: Validate Production Compose Configuration
        env:
          POSTGRES_USER: genius_prod
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          CORS_ORIGINS: https://genius.example.com
        run: docker compose -f docker-compose.prod.yml config
