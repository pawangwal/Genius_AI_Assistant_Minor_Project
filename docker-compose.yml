# Genius AI Assistant - Local Development Compose Profile (Profile A)
# Bound strictly to loopback (127.0.0.1) to prevent external network exposure.
services:
  postgres:
    image: postgres:16-alpine
    container_name: genius_postgres_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-genius_ai}
    ports:
      # Bound strictly to localhost interface (127.0.0.1)
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./scripts/init_postgres_test_db.sh:/docker-entrypoint-initdb.d/init_postgres_test_db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-genius} -d $${POSTGRES_DB:-genius_ai}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genius_dev_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: genius_backend_dev
    restart: unless-stopped
    ports:
      # Bound strictly to localhost interface (127.0.0.1)
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AUTH_REQUIRED: "false"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-genius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-genius_ai}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-genius}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-genius_ai}"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      STT_DEVICE: ${STT_DEVICE:-cpu}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - genius_dev_net

networks:
  genius_dev_net:
    driver: bridge

volumes:
  pgdata_dev:
    driver: local
